# DP 212 carries a Base64 JSON alert (ipc_baby_cry / ipc_motion) including
# image metadata, so its payload is marked sensitive.
# PTZ (119/116) and lullaby on/off (231) are command-only DPs, so their state
# stays unknown until used.
# SD formatting, device restart and siren controls are intentionally omitted.
name: Baby monitor camera
products:
  - id: raaemnfgijnl9ovf
entities:
  - entity: event
    name: Camera alert received
    icon: mdi:bell-ring-outline
    dps:
      - id: 212
        name: event
        type: string
        optional: true
        mapping:
          - value: camera_alert
      - id: 212
        name: payload
        type: string
        optional: true
        sensitive: true
  - entity: sensor
    name: Room temperature
    class: temperature
    dps:
      - id: 238
        name: sensor
        type: integer
        optional: true
        unit: C
        mapping:
          - scale: 10
        precision: 1
  - entity: sensor
    name: Room humidity
    class: humidity
    dps:
      - id: 143
        name: sensor
        type: integer
        optional: true
        unit: '%'
  - entity: sensor
    name: Reported temperature fahrenheit
    class: temperature
    category: diagnostic
    hidden: true
    dps:
      - id: 239
        name: sensor
        type: integer
        optional: true
        unit: F
        mapping:
          - scale: 10
        precision: 1
  - entity: sensor
    name: SD card status
    class: enum
    icon: mdi:sd
    category: diagnostic
    dps:
      - id: 110
        name: sensor
        type: integer
        optional: true
        mapping:
          - dps_val: 1
            value: Normal
          - dps_val: 2
            value: Error
          - dps_val: 3
            value: Full
          - dps_val: 4
            value: Formatting
          - dps_val: 5
            value: No SD card
  - entity: sensor
    name: SD card storage
    category: diagnostic
    hidden: true
    dps:
      - id: 109
        name: sensor
        type: string
        optional: true
  - entity: sensor
    name: SD format state
    category: diagnostic
    hidden: true
    dps:
      - id: 117
        name: sensor
        type: integer
        optional: true
  - entity: switch
    name: Camera status LED
    category: config
    dps:
      - id: 101
        name: switch
        type: boolean
        optional: true
  - entity: switch
    name: Camera privacy mode
    category: config
    dps:
      - id: 105
        name: switch
        type: boolean
        optional: true
  - entity: switch
    name: Motion detection enabled
    category: config
    dps:
      - id: 134
        name: switch
        type: boolean
        optional: true
  - entity: switch
    name: Cry detection enabled
    category: config
    dps:
      - id: 167
        name: switch
        type: boolean
        optional: true
  - entity: switch
    name: Recording enabled
    category: config
    dps:
      - id: 150
        name: switch
        type: boolean
        optional: true
  - entity: switch
    name: Lullaby enabled
    category: config
    dps:
      - id: 231
        name: switch
        type: boolean
        optional: true
  - entity: switch
    name: Temperature alarm
    category: config
    dps:
      - id: 237
        name: switch
        type: boolean
        optional: true
  - entity: switch
    name: High temperature alert enabled
    category: config
    dps:
      - id: 241
        name: switch
        type: boolean
        optional: true
  - entity: switch
    name: Low temperature alert enabled
    category: config
    dps:
      - id: 242
        name: switch
        type: boolean
        optional: true
  - entity: select
    name: Camera PTZ direction
    icon: mdi:camera-control
    category: config
    dps:
      - id: 119
        name: option
        type: string
        optional: true
        persist: false
        mapping:
          - dps_val: '0'
            value: Up
          - dps_val: '1'
            value: Up-Right
          - dps_val: '2'
            value: Right
          - dps_val: '3'
            value: Down-Right
          - dps_val: '4'
            value: Down
          - dps_val: '5'
            value: Down-Left
          - dps_val: '6'
            value: Left
          - dps_val: '7'
            value: Up-Left
  - entity: button
    name: Stop camera movement
    icon: mdi:stop-circle-outline
    category: config
    dps:
      - id: 116
        name: button
        type: boolean
        optional: true
        persist: false
  - entity: select
    translation_key: motion_sensitivity
    category: config
    dps:
      - id: 106
        name: option
        type: string
        optional: true
        mapping:
          - dps_val: '0'
            value: low
          - dps_val: '1'
            value: medium
          - dps_val: '2'
            value: high
  - entity: select
    name: Sound sensitivity
    category: config
    dps:
      - id: 140
        name: option
        type: string
        optional: true
        mapping:
          - dps_val: '0'
            value: Low
          - dps_val: '1'
            value: High
  - entity: select
    translation_key: night_vision
    category: config
    dps:
      - id: 108
        name: option
        type: string
        optional: true
        mapping:
          - dps_val: '0'
            value: auto
          - dps_val: '1'
            value: 'off'
          - dps_val: '2'
            value: 'on'
  - entity: select
    translation_key: recording_mode
    category: config
    dps:
      - id: 151
        name: option
        type: string
        optional: true
        mapping:
          - dps_val: '1'
            value: event
          - dps_val: '2'
            value: continuous
  - entity: select
    name: Image flip
    category: config
    dps:
      - id: 102
        name: option
        type: string
        optional: true
        mapping:
          - dps_val: flip_none
            value: Normal
          - dps_val: flip_horizontal_mirror
            value: Mirror
          - dps_val: flip_vertical_mirror
            value: Vertical flip
          - dps_val: flip_rotate_180
            value: Rotate 180
  - entity: select
    name: Anti flicker
    category: config
    hidden: true
    dps:
      - id: 188
        name: option
        type: string
        optional: true
        mapping:
          - dps_val: '0'
            value: 'Off'
          - dps_val: '1'
            value: 50Hz
          - dps_val: '2'
            value: 60Hz
  - entity: select
    name: Lullaby mode
    category: config
    dps:
      - id: 232
        name: option
        type: string
        optional: true
        mapping:
          - dps_val: '0'
            value: '0'
          - dps_val: '1'
            value: '1'
  - entity: select
    name: Lullaby playback
    category: config
    dps:
      - id: 234
        name: option
        type: string
        optional: true
        mapping:
          - dps_val: '0'
            value: '0'
          - dps_val: '1'
            value: '1'
  - entity: select
    name: Lullaby track
    category: config
    dps:
      - id: 235
        name: option
        type: string
        optional: true
        mapping:
          - dps_val: '0'
            value: Track 1
          - dps_val: '1'
            value: Track 2
          - dps_val: '2'
            value: Track 3
          - dps_val: '3'
            value: Track 4
          - dps_val: '4'
            value: Track 5
          - dps_val: '5'
            value: Track 6
          - dps_val: '6'
            value: Track 7
          - dps_val: '7'
            value: Track 8
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 240
        name: option
        type: string
        optional: true
        mapping:
          - dps_val: '0'
            value: celsius
          - dps_val: '1'
            value: fahrenheit
  - entity: number
    name: Speaker volume
    category: config
    dps:
      - id: 160
        name: value
        type: integer
        optional: true
        range:
          min: 1
          max: 10
  - entity: number
    name: Lullaby volume
    category: config
    dps:
      - id: 233
        name: value
        type: integer
        optional: true
        range:
          min: 0
          max: 10
  - entity: number
    name: High temperature limit celsius
    category: config
    dps:
      - id: 243
        name: value
        type: integer
        optional: true
        unit: C
        range:
          min: 1
          max: 500
        mapping:
          - scale: 10
  - entity: number
    name: Low temperature limit celsius
    category: config
    dps:
      - id: 244
        name: value
        type: integer
        optional: true
        unit: C
        range:
          min: 0
          max: 500
        mapping:
          - scale: 10
  - entity: number
    name: High temperature limit fahrenheit
    category: config
    hidden: true
    dps:
      - id: 245
        name: value
        type: integer
        optional: true
        unit: F
        range:
          min: 320
          max: 1220
        mapping:
          - scale: 10
  - entity: number
    name: Low temperature limit fahrenheit
    category: config
    hidden: true
    dps:
      - id: 246
        name: value
        type: integer
        optional: true
        unit: F
        range:
          min: 320
          max: 1220
        mapping:
          - scale: 10
