name: ME220FW smart water valve

products:
  - id: 6w5zwkrivvjgqizb
    manufacturer: Tuya
    model: ME220FW
    name: ME220FW Smart Valve

entities:
  - entity: valve
    name: Valve
    class: water
    dps:
      - id: 102
        type: boolean
        name: valve

  - entity: number
    name: Valve target position
    icon: "mdi:valve"
    dps:
      - id: 2
        type: integer
        name: value
        unit: "%"
        range:
          min: 0
          max: 100
        mapping:
          - step: 10

  - entity: sensor
    name: Actual valve position
    category: diagnostic
    icon: "mdi:valve"
    dps:
      - id: 3
        type: integer
        name: sensor
        unit: "%"
        class: measurement
        range:
          min: 0
          max: 100

  - entity: sensor
    name: Per-use water consumption
    class: water
    dps:
      - id: 5
        type: integer
        name: sensor
        unit: L
        class: total_increasing
        mapping:
          - scale: 100

  - entity: sensor
    name: Daily water usage
    class: water
    dps:
      - id: 6
        type: integer
        name: sensor
        unit: L
        class: total_increasing
        mapping:
          - scale: 100

  - entity: sensor
    name: Battery
    class: battery
    category: diagnostic
    dps:
      - id: 7
        type: integer
        optional: true
        force: true
        name: sensor
        unit: "%"
        class: measurement
        mapping:
          - scale: 10

  - entity: select
    name: Smart weather
    category: config
    icon: "mdi:weather-partly-cloudy"
    dps:
      - id: 13
        type: string
        name: option
        mapping:
          - dps_val: sunny
            value: Sunny
          - dps_val: clear
            value: Clear
          - dps_val: cloud
            value: Cloud
          - dps_val: cloudy
            value: Cloudy
          - dps_val: rainy
            value: Rainy
          - dps_val: snow
            value: Snow
          - dps_val: fog
            value: Fog

  - entity: number
    name: Irrigation countdown
    class: duration
    category: config
    dps:
      - id: 114
        type: integer
        name: value
        unit: s
        range:
          min: 0
          max: 86400

  - entity: sensor
    name: Water temperature
    class: temperature
    dps:
      - id: 116
        type: integer
        name: sensor
        unit: C
        class: measurement
