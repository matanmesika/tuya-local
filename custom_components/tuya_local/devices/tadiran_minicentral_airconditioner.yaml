name: Air conditioner
products:
  - id: ypydgdiic5ztkorj
    manufacturer: Tadiran
    model: Mini central air conditioner
entities:
  - entity: climate
    translation_only_key: aircon
    dps:
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            constraint: mode
            conditions:
              - dps_val: cooling
                value: cool
              - dps_val: heating
                value: heat
              - dps_val: dehum
                value: dry
              - dps_val: fan
                value: fan_only
              - dps_val: auto
                value: heat_cool
      - id: 2
        name: temperature
        type: integer
        range:
          min: 16
          max: 32
        unit: C
      - id: 3
        name: current_temperature
        type: integer
        mapping:
          - scale: 10
      - id: 4
        name: mode
        type: string
        hidden: true
      - id: 5
        name: fan_mode
        type: string
        mapping:
          - dps_val: auto
            value: auto
          - dps_val: low
            value: low
          - dps_val: middle
            value: medium
          - dps_val: high
            value: high
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 101
        type: integer
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 101
        type: integer
        name: fault_code
  - entity: sensor
    name: Return air temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 102
        type: integer
        name: sensor
        unit: C
        class: measurement
        mapping:
          - scale: 10
  - entity: sensor
    name: Coil temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 103
        type: integer
        name: sensor
        unit: C
        class: measurement
        mapping:
          - scale: 10
  - entity: sensor
    name: Fan speed
    class: enum
    category: diagnostic
    dps:
      - id: 104
        type: string
        name: sensor
        mapping:
          - dps_val: stop
            value: Stopped
          - dps_val: low
            value: Low
          - dps_val: middle
            value: Medium
          - dps_val: high
            value: High
  - entity: sensor
    name: Outdoor fan speed
    class: enum
    category: diagnostic
    dps:
      - id: 105
        type: string
        name: sensor
        mapping:
          - dps_val: stop
            value: Stopped
          - dps_val: low
            value: Low
          - dps_val: middle
            value: Medium
          - dps_val: high
            value: High
  - entity: sensor
    name: Outdoor temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 106
        type: integer
        name: sensor
        unit: C
        class: measurement
        mapping:
          - scale: 10
  - entity: binary_sensor
    name: Compressor
    class: running
    category: diagnostic
    dps:
      - id: 107
        type: boolean
        name: sensor
  - entity: binary_sensor
    name: Four-way valve
    class: opening
    category: diagnostic
    dps:
      - id: 108
        type: boolean
        name: sensor
